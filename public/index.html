<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Device Fleet Monitor</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root { color-scheme: light dark; }
  body {
    font-family: -apple-system, Segoe UI, Roboto, sans-serif;
    max-width: 900px;
    margin: 2rem auto;
    padding: 0 1rem;
  }
  h1 { font-size: 1.4rem; }
  .summary { display: flex; gap: 1rem; margin: 1rem 0 1.5rem; }
  .stat {
    border: 1px solid #8884;
    border-radius: 8px;
    padding: 0.75rem 1.25rem;
    text-align: center;
  }
  .stat .n { font-size: 1.6rem; font-weight: 600; display: block; }
  .stat .label { font-size: 0.8rem; opacity: 0.7; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 0.5rem 0.6rem; border-bottom: 1px solid #8883; }
  .badge { padding: 0.15rem 0.5rem; border-radius: 999px; font-size: 0.75rem; font-weight: 600; }
  .badge.ONLINE { background: #16a34a33; color: #16a34a; }
  .badge.OFFLINE { background: #dc262633; color: #dc2626; }
  select, button {
    font: inherit;
    padding: 0.35rem 0.6rem;
    border-radius: 6px;
    border: 1px solid #8888;
  }
  .toolbar { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 0.75rem; }
  #updated { font-size: 0.8rem; opacity: 0.6; margin-left: auto; }
  .empty { opacity: 0.6; padding: 1rem 0; }
</style>
</head>
<body>
  <h1>Device Fleet Monitor</h1>

  <div class="summary" id="summary"></div>

  <div class="toolbar">
    <label for="filter">Filter:</label>
    <select id="filter">
      <option value="">All</option>
      <option value="ONLINE">Online</option>
      <option value="OFFLINE">Offline</option>
    </select>
    <span id="updated"></span>
  </div>

  <table>
    <thead>
      <tr><th>ID</th><th>Name</th><th>Status</th><th>Last heartbeat</th><th>Metrics</th></tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>
  <p class="empty" id="empty" hidden>No devices registered yet. Run the simulator to see them here.</p>

  <script>
    const rowsEl = document.getElementById("rows");
    const summaryEl = document.getElementById("summary");
    const emptyEl = document.getElementById("empty");
    const updatedEl = document.getElementById("updated");
    const filterEl = document.getElementById("filter");

    function renderSummary(s) {
      summaryEl.innerHTML = `
        <div class="stat"><span class="n">${s.total}</span><span class="label">Total</span></div>
        <div class="stat"><span class="n">${s.online}</span><span class="label">Online</span></div>
        <div class="stat"><span class="n">${s.offline}</span><span class="label">Offline</span></div>
      `;
    }

    function renderDevices(devices) {
      rowsEl.innerHTML = "";
      emptyEl.hidden = devices.length > 0;
      for (const d of devices) {
        const tr = document.createElement("tr");
        const metrics = d.metrics
          ? Object.entries(d.metrics).map(([k, v]) => `${k}: ${v}`).join(", ")
          : "-";
        tr.innerHTML = `
          <td>${d.id}</td>
          <td>${d.name}</td>
          <td><span class="badge ${d.status}">${d.status}</span></td>
          <td>${d.last_heartbeat ?? "never"}</td>
          <td>${metrics}</td>
        `;
        rowsEl.appendChild(tr);
      }
    }

    async function refresh() {
      const status = filterEl.value;
      const query = status ? `?status=${status}` : "";
      const [devicesRes, summaryRes] = await Promise.all([
        fetch(`/devices${query}`),
        fetch("/summary"),
      ]);
      renderDevices(await devicesRes.json());
      renderSummary(await summaryRes.json());
      updatedEl.textContent = `updated ${new Date().toLocaleTimeString()}`;
    }

    filterEl.addEventListener("change", refresh);
    refresh();
    setInterval(refresh, 3000);
  </script>
</body>
</html>
